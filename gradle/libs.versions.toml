[versions]
# ─── Core ─────────────────────────────────────────────────────────────────────
# KSP version MUST be {kotlinVersion}-{kspPatch}.
# Check https://github.com/google/ksp/releases for the patch that matches your
# exact Kotlin version. Example below assumes kotlin 2.1.0 — update both together.
agp                     = "9.0.1"
kotlin                  = "2.1.0"
ksp                     = "2.1.0-1.0.29"

# ─── AndroidX ─────────────────────────────────────────────────────────────────
coreKtx                 = "1.18.0"
lifecycleRuntimeKtx     = "2.10.0"
lifecycleRuntimeCompose = "2.10.0"
activityCompose         = "1.13.0"
composeBom              = "2026.03.01"
navigationCompose       = "2.9.7"
hiltNavigationCompose   = "1.3.0"

# ─── Hilt ─────────────────────────────────────────────────────────────────────
hilt                    = "2.59.2"
hiltWork                = "1.3.0"

# ─── Room ─────────────────────────────────────────────────────────────────────
room                    = "2.8.4"

# ─── Network ──────────────────────────────────────────────────────────────────
retrofit                = "3.0.0"
okhttp                  = "5.3.2"
ktor                    = "3.4.2"

# ─── Firebase ─────────────────────────────────────────────────────────────────
googleServices          = "4.4.4"
firebaseBom             = "34.11.0"

# ─── Credentials / Google Sign-In ─────────────────────────────────────────────
credentials             = "1.5.0"
googleid                = "1.2.0"

# ─── WorkManager ──────────────────────────────────────────────────────────────
work                    = "2.11.2"

# ─── Image loading ────────────────────────────────────────────────────────────
coil                    = "2.7.0"

# ─── QR code ──────────────────────────────────────────────────────────────────
zxing                   = "3.5.4"

# ─── Misc ─────────────────────────────────────────────────────────────────────
datastore               = "1.2.1"
lottie                  = "6.7.1"
timber                  = "5.0.1"

# ─── Testing ──────────────────────────────────────────────────────────────────
junit                   = "4.13.2"
junitExt                = "1.3.0"
espresso                = "3.7.0"
ui = "1.10.6"
playServiceLocation = "21.3.0"
runtime = "1.10.6"

# ─────────────────────────────────────────────────────────────────────────────

[libraries]
# ─── AndroidX core ────────────────────────────────────────────────────────────
androidx-core-ktx                    = { group = "androidx.core",      name = "core-ktx",                     version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",    version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group = "androidx.activity",  name = "activity-compose",             version.ref = "activityCompose" }
androidx-splashscreen                = { group = "androidx.core",      name = "core-splashscreen",            version = "1.2.0" }

# ─── Compose ──────────────────────────────────────────────────────────────────
androidx-compose-bom                      = { group = "androidx.compose",          name = "compose-bom",              version.ref = "composeBom" }
androidx-compose-ui                       = { group = "androidx.compose.ui",        name = "ui" }
androidx-compose-ui-graphics              = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-compose-ui-tooling               = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-compose-ui-tooling-preview       = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest         = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
androidx-compose-ui-test-junit4           = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
androidx-compose-material3                = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended  = { group = "androidx.compose.material",  name = "material-icons-extended" }
androidx-compose-animation                = { group = "androidx.compose.animation", name = "animation" }

# ─── Navigation ───────────────────────────────────────────────────────────────
androidx-navigation-compose         = { group = "androidx.navigation", name = "navigation-compose",          version.ref = "navigationCompose" }

# ─── Hilt ─────────────────────────────────────────────────────────────────────
hilt-android                        = { group = "com.google.dagger",   name = "hilt-android",                version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",   name = "hilt-compiler",               version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt",       name = "hilt-navigation-compose",     version.ref = "hiltNavigationCompose" }
androidx-hilt-work                  = { group = "androidx.hilt",       name = "hilt-work",                   version.ref = "hiltWork" }
androidx-hilt-compiler              = { group = "androidx.hilt",       name = "hilt-compiler",               version.ref = "hiltWork" }

# ─── Room ─────────────────────────────────────────────────────────────────────
androidx-room-runtime               = { group = "androidx.room",       name = "room-runtime",                version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room",       name = "room-ktx",                    version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",       name = "room-compiler",               version.ref = "room" }

# ─── Network ──────────────────────────────────────────────────────────────────
retrofit                            = { group = "com.squareup.retrofit2", name = "retrofit",                  version.ref = "retrofit" }
retrofit-gson                       = { group = "com.squareup.retrofit2", name = "converter-gson",            version.ref = "retrofit" }
okhttp                              = { group = "com.squareup.okhttp3",   name = "okhttp",                    version.ref = "okhttp" }
okhttp-logging                      = { group = "com.squareup.okhttp3",   name = "logging-interceptor",       version.ref = "okhttp" }
ktor-client-core                    = { group = "io.ktor", name = "ktor-client-core",                         version.ref = "ktor" }
ktor-client-android                 = { group = "io.ktor", name = "ktor-client-android",                      version.ref = "ktor" }
ktor-client-content-negotiation     = { group = "io.ktor", name = "ktor-client-content-negotiation",          version.ref = "ktor" }
ktor-serialization-json             = { group = "io.ktor", name = "ktor-serialization-kotlinx-json",          version.ref = "ktor" }
ktor-client-logging                 = { group = "io.ktor", name = "ktor-client-logging",                      version.ref = "ktor" }

# ─── Firebase ─────────────────────────────────────────────────────────────────
firebase-bom                        = { group = "com.google.firebase",  name = "firebase-bom",                version.ref = "firebaseBom" }
firebase-auth                       = { group = "com.google.firebase",  name = "firebase-auth" }
firebase-firestore                  = { group = "com.google.firebase",  name = "firebase-firestore" }
firebase-messaging                  = { group = "com.google.firebase",  name = "firebase-messaging" }
firebase-analytics                  = { group = "com.google.firebase",  name = "firebase-analytics" }
firebase-storage                    = { group = "com.google.firebase",  name = "firebase-storage" }

# ─── Google credentials / Sign-In ─────────────────────────────────────────────
androidx-credentials                = { group = "androidx.credentials", name = "credentials",                 version.ref = "credentials" }
androidx-credentials-play           = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid                            = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
play-services-location             =  {module = "com.google.android.gms:play-services-location", version.ref ="playServiceLocation"}
# ─── WorkManager ──────────────────────────────────────────────────────────────
androidx-work-runtime-ktx           = { group = "androidx.work",        name = "work-runtime-ktx",            version.ref = "work" }

# ─── Image loading ────────────────────────────────────────────────────────────
coil-compose                        = { group = "io.coil-kt",           name = "coil-compose",                version.ref = "coil" }

# ─── QR code ──────────────────────────────────────────────────────────────────
zxing-core                          = { group = "com.google.zxing",     name = "core",                        version.ref = "zxing" }

# ─── DataStore ────────────────────────────────────────────────────────────────
androidx-datastore-preferences      = { group = "androidx.datastore",   name = "datastore-preferences",       version.ref = "datastore" }

# ─── Lottie ───────────────────────────────────────────────────────────────────
lottie-compose                      = { group = "com.airbnb.android",   name = "lottie-compose",              version.ref = "lottie" }

# ─── Timber ───────────────────────────────────────────────────────────────────
timber                              = { group = "com.jakewharton.timber", name = "timber",                    version.ref = "timber" }

# ─── Coroutines ───────────────────────────────────────────────────────────────
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version = "1.10.2" }
kotlinx-coroutines-play-services    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version = "1.10.2" }

# ─── Testing ──────────────────────────────────────────────────────────────────
junit                               = { group = "junit",                name = "junit",                       version.ref = "junit" }
androidx-junit                      = { group = "androidx.test.ext",    name = "junit",                       version.ref = "junitExt" }
androidx-espresso-core              = { group = "androidx.test.espresso", name = "espresso-core",             version.ref = "espresso" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }

# ─────────────────────────────────────────────────────────────────────────────

[plugins]
android-application     = { id = "com.android.application",                     version.ref = "agp" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",          version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",    version.ref = "kotlin" }
kotlin-parcelize        = { id = "org.jetbrains.kotlin.plugin.parcelize",        version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",               version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",                      version.ref = "ksp" }
google-services         = { id = "com.google.gms.google-services",               version.ref = "googleServices" }